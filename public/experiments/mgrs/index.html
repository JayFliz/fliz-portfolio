<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f0c">
<link rel="manifest" href="manifest.json">
<title>MGRS Logger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0b0f0c;color:#e6f2e4;font-family:-apple-system,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px);gap:14px}

.grid-box{background:#121a14;border-radius:12px;padding:18px 20px;border:1px solid #1f2d22}
.label{color:#6f8f75;font-size:11px;letter-spacing:2px;font-weight:600;text-transform:uppercase}
.grid-ref{color:#d8ffd0;font-size:30px;font-family:Menlo,monospace;font-weight:700;margin-top:6px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.datum{background:#121a14;border-radius:10px;padding:10px 12px;border:1px solid #1f2d22}
.datum-value{color:#e6f2e4;font-size:17px;font-family:Menlo,monospace;margin-top:4px}

.counts{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.count-text{color:#8aa38f;font-size:13px}
.rec{color:#ff5c5c;font-weight:700;letter-spacing:1px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.buttons{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>button{flex:1}
button{width:100%;padding:15px;border:none;border-radius:10px;color:#fff;font-weight:600;
  font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.7}
button:disabled{opacity:.4;pointer-events:none}
.btn-primary{background:#2f7d46}
.btn-secondary{background:#1f2d22}
.btn-danger{background:#a63a3a}
.btn-ghost{background:transparent;color:#8a9}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.modal{background:#1a231c;border-radius:14px;padding:24px;width:100%;max-width:320px;border:1px solid #2a3d2e}
.modal h3{color:#d8ffd0;margin-bottom:4px;font-size:17px}
.modal p{color:#8aa38f;font-size:13px;margin-bottom:16px}
.modal input{width:100%;padding:12px;background:#0b0f0c;border:1px solid #2a3d2e;border-radius:8px;
  color:#e6f2e4;font-size:16px;outline:none}
.modal input:focus{border-color:#2f7d46}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{padding:12px}
</style>
</head>
<body>

<div class="grid-box">
  <div class="label">MGRS &middot; WGS84</div>
  <div class="grid-ref" id="gridRef">ACQUIRING&hellip;</div>
</div>

<div class="data-grid">
  <div class="datum"><div class="label">LAT</div><div class="datum-value" id="dLat">&mdash;</div></div>
  <div class="datum"><div class="label">LON</div><div class="datum-value" id="dLon">&mdash;</div></div>
  <div class="datum"><div class="label">ALT</div><div class="datum-value" id="dAlt">&mdash;</div></div>
  <div class="datum"><div class="label">ACC</div><div class="datum-value" id="dAcc">&mdash;</div></div>
  <div class="datum"><div class="label">HDG</div><div class="datum-value" id="dHdg">&mdash;</div></div>
  <div class="datum"><div class="label">SPD</div><div class="datum-value" id="dSpd">&mdash;</div></div>
</div>

<div class="counts">
  <span class="count-text" id="countText">0 waypoints &middot; 0 tracks &middot; 0 track pts</span>
  <span class="rec" id="recBadge" hidden>&bull; REC</span>
</div>

<div class="buttons">
  <button class="btn-primary" id="btnWaypoint" disabled>Mark waypoint</button>
  <button class="btn-primary" id="btnTrack" disabled>Start track</button>
  <div class="row">
    <button class="btn-secondary" id="btnCsv">Export CSV</button>
    <button class="btn-secondary" id="btnGeo">Export GeoJSON</button>
  </div>
  <button class="btn-ghost" id="btnClear">Clear data</button>
</div>

<script>
// ── MGRS conversion (WGS84 lon/lat → MGRS) ────────────────────────────
const MGRS = (() => {
  const DEG2RAD = Math.PI / 180;
  const a = 6378137;               // WGS84 semi-major
  const f = 1 / 298.257223563;
  const e2 = 2 * f - f * f;
  const ep2 = e2 / (1 - e2);
  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const k0 = 0.9996;

  const ZONE_LETTERS = 'CDEFGHJKLMNPQRSTUVWX';
  const SET1 = 'ABCDEFGH';
  const SET2 = 'JKLMNPQR';
  const SET3 = 'STUVWXYZ';
  const COL_SETS = [SET1, SET2, SET3];
  const ROW_LETTERS = 'ABCDEFGHJKLMNPQRSTUV';

  function forward(lat, lon, precision) {
    if (precision == null) precision = 5;
    if (lat < -80 || lat > 84) return `${lat.toFixed(5)},${lon.toFixed(5)}`;

    let zone = Math.floor((lon + 180) / 6) + 1;
    // Norway/Svalbard exceptions
    if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;
    if (lat >= 72 && lat < 84) {
      if (lon >= 0 && lon < 9) zone = 31;
      else if (lon >= 9 && lon < 21) zone = 33;
      else if (lon >= 21 && lon < 33) zone = 35;
      else if (lon >= 33 && lon < 42) zone = 37;
    }

    const lonOrigin = (zone - 1) * 6 - 180 + 3;
    const latRad = lat * DEG2RAD;
    const lonRad = lon * DEG2RAD;
    const lonOriginRad = lonOrigin * DEG2RAD;

    const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
    const T = Math.tan(latRad) ** 2;
    const C = ep2 * Math.cos(latRad) ** 2;
    const A = Math.cos(latRad) * (lonRad - lonOriginRad);

    const M = a * (
      (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * latRad -
      (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * latRad) +
      (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * latRad) -
      (35 * e2 ** 3 / 3072) * Math.sin(6 * latRad)
    );

    let easting = k0 * N * (
      A + (1 - T + C) * A ** 3 / 6 +
      (5 - 18 * T + T ** 2 + 72 * C - 58 * ep2) * A ** 5 / 120
    ) + 500000;

    let northing = k0 * (
      M + N * Math.tan(latRad) * (
        A ** 2 / 2 +
        (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24 +
        (61 - 58 * T + T ** 2 + 600 * C - 330 * ep2) * A ** 6 / 720
      )
    );
    if (lat < 0) northing += 10000000;

    // Zone letter
    const letterIdx = Math.floor((lat + 80) / 8);
    const zoneLetter = ZONE_LETTERS[Math.min(letterIdx, ZONE_LETTERS.length - 1)];

    // 100km grid square
    const setIdx = (zone - 1) % 3;
    const colLetterIdx = Math.floor(easting / 100000) - 1;
    const colLetter = COL_SETS[setIdx][colLetterIdx % 8];

    const rowIdx = Math.floor(northing / 100000) % 20;
    const rowOffset = (zone - 1) % 2 === 0 ? 5 : 0;
    const rowLetter = ROW_LETTERS[(rowIdx + rowOffset) % 20];

    const e100k = easting % 100000;
    const n100k = northing % 100000;
    const div = Math.pow(10, 5 - precision);
    const eStr = String(Math.floor(e100k / div)).padStart(precision, '0');
    const nStr = String(Math.floor(n100k / div)).padStart(precision, '0');

    return `${zone}${zoneLetter}${colLetter}${rowLetter}${eStr}${nStr}`;
  }

  function format(ref) {
    const m = ref.match(/^(\d{1,2}[C-X])([A-Z]{2})(\d+)$/i);
    if (!m) return ref;
    const [, gzd, sq, digits] = m;
    const half = digits.length / 2;
    return `${gzd} ${sq} ${digits.slice(0, half)} ${digits.slice(half)}`;
  }

  return { forward, format };
})();

// ── IndexedDB ───────────────────────────────────────────────────────────
const DB_NAME = 'mgrs-logger';
const DB_VER = 1;
let idb;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('points')) {
        const s = d.createObjectStore('points', { keyPath: 'id', autoIncrement: true });
        s.createIndex('kind', 'kind');
        s.createIndex('track_id', 'track_id');
      }
      if (!d.objectStoreNames.contains('tracks')) {
        d.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => { idb = req.result; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode) { return idb.transaction(store, mode).objectStore(store); }

function dbAdd(store, obj) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').add(obj);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').put(obj);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readonly').getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbGet(store, id) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readonly').get(id);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbClear(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

// ── State ───────────────────────────────────────────────────────────────
let fix = null;
let trackId = null;
let trackWatchId = null;
const MIN_METRES = 5;

function metres(aLat, aLon, bLat, bLon) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat), dLon = toRad(bLon - aLon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ── UI refs ─────────────────────────────────────────────────────────────
const $grid = document.getElementById('gridRef');
const $lat = document.getElementById('dLat');
const $lon = document.getElementById('dLon');
const $alt = document.getElementById('dAlt');
const $acc = document.getElementById('dAcc');
const $hdg = document.getElementById('dHdg');
const $spd = document.getElementById('dSpd');
const $counts = document.getElementById('countText');
const $rec = document.getElementById('recBadge');
const $btnWp = document.getElementById('btnWaypoint');
const $btnTk = document.getElementById('btnTrack');

function updateDisplay() {
  if (!fix) return;
  const mgrs = MGRS.forward(fix.lat, fix.lon);
  $grid.textContent = MGRS.format(mgrs);
  $lat.textContent = fix.lat.toFixed(6);
  $lon.textContent = fix.lon.toFixed(6);
  $alt.textContent = fix.alt != null ? `${fix.alt.toFixed(0)} m` : '\u2014';
  $acc.textContent = fix.accuracy != null ? `\u00B1${fix.accuracy.toFixed(0)} m` : '\u2014';
  $hdg.textContent = fix.heading != null && fix.heading >= 0 ? `${fix.heading.toFixed(0)}\u00B0` : '\u2014';
  $spd.textContent = fix.speed != null && fix.speed >= 0 ? `${(fix.speed * 3.6).toFixed(1)} km/h` : '\u2014';
  $btnWp.disabled = false;
  $btnTk.disabled = false;
}

async function refreshCounts() {
  const pts = await dbGetAll('points');
  const trks = await dbGetAll('tracks');
  const wp = pts.filter(p => p.kind === 'waypoint').length;
  const tp = pts.filter(p => p.kind === 'track').length;
  $counts.textContent = `${wp} waypoints \u00B7 ${trks.length} tracks \u00B7 ${tp} track pts`;
}

// ── Geolocation ─────────────────────────────────────────────────────────
function startWatching() {
  if (!navigator.geolocation) {
    $grid.textContent = 'Geolocation not supported';
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      const c = pos.coords;
      fix = {
        lat: c.latitude, lon: c.longitude, alt: c.altitude,
        accuracy: c.accuracy,
        heading: c.heading, speed: c.speed,
        timestamp: pos.timestamp,
      };
      updateDisplay();
    },
    (err) => { $grid.textContent = `Error: ${err.message}`; },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
}

// ── Waypoint ────────────────────────────────────────────────────────────
function showModal(title, subtitle, defaultVal, onOk) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${title}</h3>
    <p>${subtitle}</p>
    <input type="text" value="${defaultVal}" id="modalInput">
    <div class="modal-btns">
      <button class="btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn-primary" id="modalOk">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('modalInput');
  input.focus();
  input.select();
  document.getElementById('modalCancel').onclick = () => overlay.remove();
  document.getElementById('modalOk').onclick = () => {
    onOk(input.value.trim() || null);
    overlay.remove();
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('modalOk').click(); };
}

$btnWp.onclick = async () => {
  if (!fix) return;
  const snap = { ...fix };
  const mgrs = MGRS.forward(snap.lat, snap.lon);
  const pts = await dbGetAll('points');
  const wpCount = pts.filter(p => p.kind === 'waypoint').length;
  showModal('Mark waypoint', MGRS.format(mgrs), `WP ${wpCount + 1}`, async (name) => {
    await dbAdd('points', {
      track_id: trackId, kind: 'waypoint', name,
      lat: snap.lat, lon: snap.lon, alt: snap.alt,
      accuracy: snap.accuracy, heading: snap.heading, speed: snap.speed,
      mgrs, recorded_at: new Date(snap.timestamp).toISOString(),
    });
    refreshCounts();
  });
};

// ── Tracking ────────────────────────────────────────────────────────────
let lastTrackPt = null;

$btnTk.onclick = async () => {
  if (trackId == null) {
    // Start
    const trks = await dbGetAll('tracks');
    const t = { name: `Track ${trks.length + 1}`, started_at: new Date().toISOString(), ended_at: null };
    trackId = await dbAdd('tracks', t);
    lastTrackPt = null;
    $btnTk.textContent = 'Stop track';
    $btnTk.className = 'btn-danger';
    $rec.hidden = false;
    startTrackRecording();
  } else {
    // Stop
    stopTrackRecording();
    const t = await dbGet('tracks', trackId);
    t.ended_at = new Date().toISOString();
    await dbPut('tracks', t);
    trackId = null;
    lastTrackPt = null;
    $btnTk.textContent = 'Start track';
    $btnTk.className = 'btn-primary';
    $rec.hidden = true;
  }
  refreshCounts();
};

function startTrackRecording() {
  trackWatchId = setInterval(async () => {
    if (!fix || trackId == null) return;
    if (lastTrackPt && metres(lastTrackPt.lat, lastTrackPt.lon, fix.lat, fix.lon) < MIN_METRES) return;
    const mgrs = MGRS.forward(fix.lat, fix.lon);
    await dbAdd('points', {
      track_id: trackId, kind: 'track', name: null,
      lat: fix.lat, lon: fix.lon, alt: fix.alt,
      accuracy: fix.accuracy, heading: fix.heading, speed: fix.speed,
      mgrs, recorded_at: new Date(fix.timestamp).toISOString(),
    });
    lastTrackPt = { lat: fix.lat, lon: fix.lon };
    refreshCounts();
  }, 3000);
}

function stopTrackRecording() {
  if (trackWatchId != null) { clearInterval(trackWatchId); trackWatchId = null; }
}

// ── Export ───────────────────────────────────────────────────────────────
function downloadFile(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 100);
}

function stamp() {
  return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
}

function csvCell(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

document.getElementById('btnCsv').onclick = async () => {
  const pts = await dbGetAll('points');
  if (!pts.length) { alert('No data to export'); return; }
  const cols = ['id','track_id','kind','name','lat','lon','alt','accuracy','heading','speed','mgrs','recorded_at'];
  const rows = pts.map(p => cols.map(c => csvCell(p[c])).join(','));
  downloadFile(`mgrs-points-${stamp()}.csv`, 'text/csv', [cols.join(','), ...rows].join('\n') + '\n');
};

document.getElementById('btnGeo').onclick = async () => {
  const pts = await dbGetAll('points');
  const trks = await dbGetAll('tracks');
  if (!pts.length) { alert('No data to export'); return; }

  const features = pts.filter(p => p.kind === 'waypoint').map(p => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [p.lon, p.lat, p.alt ?? 0] },
    properties: { id: p.id, kind: p.kind, name: p.name, mgrs: p.mgrs,
      accuracy: p.accuracy, heading: p.heading, speed: p.speed, recorded_at: p.recorded_at },
  }));

  for (const t of trks) {
    const tpts = pts.filter(p => p.track_id === t.id);
    if (tpts.length < 2) continue;
    features.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: tpts.map(p => [p.lon, p.lat, p.alt ?? 0]) },
      properties: { id: t.id, kind: 'track', name: t.name, started_at: t.started_at,
        ended_at: t.ended_at, point_count: tpts.length,
        start_mgrs: tpts[0].mgrs, end_mgrs: tpts[tpts.length - 1].mgrs },
    });
  }

  const fc = { type: 'FeatureCollection', features };
  downloadFile(`mgrs-export-${stamp()}.geojson`, 'application/geo+json', JSON.stringify(fc, null, 1));
};

// ── Clear ───────────────────────────────────────────────────────────────
document.getElementById('btnClear').onclick = async () => {
  if (!confirm('Clear all data? Deletes every waypoint and track.')) return;
  if (trackId != null) {
    stopTrackRecording();
    trackId = null;
    $btnTk.textContent = 'Start track';
    $btnTk.className = 'btn-primary';
    $rec.hidden = true;
  }
  await dbClear('points');
  await dbClear('tracks');
  refreshCounts();
};

// ── Boot ────────────────────────────────────────────────────────────────
(async () => {
  await openDb();
  refreshCounts();
  startWatching();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
