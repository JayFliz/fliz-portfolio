function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* Fake-but-stable QR from a booking ref */
function QRBlock({ seed, size = 108 }) {
  const n = 17;
  const cells = useMemo(() => {
    const h = hashStr(seed);
    const out = [];
    let s = h;
    for (let i = 0; i < n * n; i++) {
      s = (Math.imul(s, 1103515245) + 12345) >>> 0;
      out.push((s >> 16) & 1);
    }
    return out;
  }, [seed]);
  const cell = size / n;
  const finder = (r, c) =>
    (r < 4 && c < 4) || (r < 4 && c >= n - 4) || (r >= n - 4 && c < 4);
  return (
    <div
      aria-label={`QR code for ${seed}`}
      style={{
        width: size,
        height: size,
        display: "grid",
        gridTemplateColumns: `repeat(${n}, 1fr)`,
        background: "#fff",
        padding: 6,
        borderRadius: 8,
      }}
    >
      {cells.map((v, i) => {
        const r = Math.floor(i / n), c = i % n;
        const on = finder(r, c)
          ? (r % 3 !== 1 || c % 3 !== 1)
          : v === 1;
        return (
          <div key={i} style={{ width: cell, height: cell, background: on ? "#131020" : "#fff" }} />
        );
      })}
    </div>
  );
}

/* ---------------- journey rail ---------------- */

const RAIL = [
  { id: "discover", n: "01", label: "Discover" },
  { id: "browse", n: "02", label: "Browse" },
  { id: "auth", n: "03", label: "Sign in" },

];

const FORK_STEPS = {
  booked: ["bookpay", "confirm", "reminder"],
  walkin: ["walkin"],
};

function stepToRail(stepId) {
  if (["fork", "bookpay", "confirm", "reminder", "walkin"].includes(stepId)) return "fork";
  return stepId;
}

function JourneyRail({ stepId, path }) {
  const activeRail = stepToRail(stepId);
  const activeIdx = RAIL.findIndex((r) => r.id === activeRail);
  return (
    <div className="w-full overflow-x-auto pb-1" style={{ scrollbarWidth: "thin" }}>
      <div className="flex items-center min-w-max gap-0 px-1">
        {RAIL.map((r, i) => {
          const done = i < activeIdx;
          const active = i === activeIdx;
          if (r.fork) {
            const inBooked = ["bookpay", "confirm", "reminder"].includes(stepId);
            const inWalkin = stepId === "walkin";
            const lane = (label, sub, on, chosen, tone) => (
              <div
                className="px-2.5 py-1 rounded-md text-center"
                style={{
                  border: `1px solid ${on ? tone : chosen ? tone + "55" : C.line}`,
                  background: on ? tone + "22" : "transparent",
                  opacity: !path || chosen || on ? 1 : 0.35,
                  minWidth: 110,
                }}
              >
                <div
                  style={{
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: 13,
                    letterSpacing: "0.08em",
                    textTransform: "uppercase",
                    color: on ? tone : C.text,
                  }}
                >
                  {label}
                </div>
                <div style={{ fontSize: 10, color: C.dim, fontFamily: "'JetBrains Mono', monospace" }}>{sub}</div>
              </div>
            );
            return (
              <div key="fork" className="flex items-center">
                <Tick done={done} active={active} />
                <div className="flex flex-col gap-1 mx-2">
                  {lane("4A–6A Book & pay", "book · confirm · remind", inBooked, path === "booked", C.magenta)}
                  {lane("4B Just turn up", "no digital touchpoint", inWalkin, path === "walkin", C.mint)}
                </div>
                <Connector done={done || ["checkin","attend","followup","invoice","return"].includes(stepId)} />
              </div>
            );
          }
          return (
            <div key={r.id} className="flex items-center">
              <div className="flex flex-col items-center" style={{ minWidth: 64 }}>
                <Tick done={done} active={active} n={r.n} />
                <div
                  style={{
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: 12.5,
                    letterSpacing: "0.1em",
                    textTransform: "uppercase",
                    color: active ? C.magenta : done ? C.text : C.dim,
                    marginTop: 3,
                  }}
                >
                  {r.label}
                </div>
              </div>
              {i < RAIL.length - 1 && <Connector done={done} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Tick({ done, active, n }) {
  return (
    <div

        width: 26,

        border: `2px solid ${active ? C.magenta : done ? C.mint : C.line}`,

}

}

function App() {
  const [stepId, setStepId] = useState("discover");
  const [path, setPath] = useState(null); // 'booked' | 'walkin'
  const [channel, setChannel] = useState(null);
  const [eventId, setEventId] = useState(null);
  const [memberId, setMemberId] = useState(null);
  const [isNewMember, setIsNewMember] = useState(false);
  const [lastWrite, setLastWrite] = useState(null);
  const [trace, setTrace] = useState([]);
  const [db, setDb] = useState({
    members: [], loyalty: [], bookings: [], transactions: [],
    attendances: [], emailEvents: [], invoices: [], discountRedemptions: [],
  });

  const log = (system, action) =>
    setTrace((t) => [...t, { system, action, at: now() }]);

  const write = (table, rec) => {
    setDb((d) => ({ ...d, [table]: [...d[table], rec] }));
    setLastWrite(rec.id);
  };
  const update = (table, id, patch) => {
    setDb((d) => ({ ...d, [table]: d[table].map((r) => (r.id === id ? { ...r, ...patch } : r)) }));
    setLastWrite(id);
  };

  const event = EVENTS.find((e) => e.id === eventId);
  const member = db.members.find((m) => m.id === memberId);
  const loyalty = db.loyalty.find((l) => l.memberId === memberId);
  const booking = db.bookings.find((b) => b.memberId === memberId && b.eventId === eventId);
  const attendance = db.attendances.find((a) => a.memberId === memberId && a.eventId === eventId);
  const invoice = db.invoices[0];

  /* ---------- step actions ---------- */

  const discover = (ch) => {
    setChannel(ch);
    if (ch === "email") {
      write("emailEvents", { id: uid("evm"), name: "Campaign: 'Freestyle this week' — opened, clicked", kind: "campaign.click", at: now() });
      log("Iterable", "email open + click tracked, UTM utm_source=iterable");
    } else if (ch === "social") {
      log("Website", "page view · utm_source=instagram utm_campaign=aug_freestyle");
    } else {
      log("Website", "organic page view captured (analytics)");
    }
    setStepId("browse");
  };

  const chooseEvent = (id) => {
    setEventId(id);
    log("Member App", `event viewed: ${id} · filters {territory: Essex Coast}`);
    log("API", `GET /events?territory=ter_essex → 200`);
    if (memberId) {
      log("SSO", "existing session token still valid — auth skipped");
      setStepId("fork");
    } else {
      setStepId("auth");
    }
  };

  const authFindMe = () => {
    const m = { ...EXISTING_MEMBER };
    write("members", m);
    write("loyalty", { id: uid("loy"), memberId: m.id, stamps: m.stamps, milestone: 10, rewardUnlocked: false, redeemed: false });
    setMemberId(m.id);

  const chosenEntry = event?.entryTypes.find((e) => e.id === entryTypeId);
  const discountApplied = codeState === "ok";
  const total = chosenEntry ? chosenEntry.price * (discountApplied ? (100 - DISCOUNT.pct) / 100 : 1) : 0;

  const payOnline = () => {
    const bId = uid("bkg");
    const intent = "pi_" + Math.random().toString(36).slice(2, 10);
    write("bookings", {
      id: bId, memberId, eventId, entryTypeName: chosenEntry.name,
      status: "Confirmed", discountCode: discountApplied ? DISCOUNT.code : null,

    if (discountApplied) {
      write("discountRedemptions", {
        id: uid("red"), code: DISCOUNT.code, pct: DISCOUNT.pct, scope: "ter_essex",
        saved: chosenEntry.price - total,

    log("API", `booking ${bId} created · status Confirmed`);
    setStepId("confirm");

  const sendReminder = () => {
    write("emailEvents", { id: uid("evm"), name: "T-24h reminder · directions + 'see you tomorrow'", kind: "transactional.sent", at: now() });
    log("Iterable", "reminder push + email delivered, open tracked");
    setStepId("checkin");
  };

  /* ---- door check-in ---- */
  const [doorEntryId, setDoorEntryId] = useState(null);
  const [doorPay, setDoorPay] = useState(null);
  const [emailConfirmed, setEmailConfirmed] = useState(false);
  const [scanned, setScanned] = useState(false);

  const doCheckIn = () => {
    const entry = path === "booked" ? booking.entryTypeName : event.entryTypes.find((e) => e.id === doorEntryId)?.name;
    const payment = path === "booked" ? "pre-paid" : doorPay;
    const aId = uid("att");
    write("attendances", { id: aId, memberId, eventId, entryTypeName: entry, payment, at: now() });
    if (path === "booked") {
      update("bookings", booking.id, { status: "Attended" });
      log("Venue App", `booking ${booking.id}: Confirmed → Attended`);
    } else {
      write("transactions", { id: uid("txn"), amount: event.entryTypes.find((e) => e.id === doorEntryId).price, method: `door_${doorPay}`, stripeIntent: null, bookingId: null });

              <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6 }}>

                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.violet }}>{booking?.qrRef || "…"}</span>
              </div>
            </div>
            <p style={{ ...pMuted, marginTop: 12 }}>Confirmation email sent with QR, receipt and cancellation policy. Open tracking is on.</p>
            <Btn style={{ marginTop: 10 }} onClick={() => setStepId("reminder")}>Continue → reminder</Btn>
            <div className="mt-4">{["Iterable", "Member App"].map((s) => <SysBadge key={s} name={s} />)}</div>

            <p style={pMuted}>Service charges = attendance × {gbp(SERVICE_CHARGE_RATE)}. Reconciled against Stripe payouts, door cash, discount usage and loyalty reports.</p>
            {!invoice ? (
              <Btn tone="#FF9D6B" style={{ marginTop: 12 }} onClick={generateInvoice}>Generate invoice from {attendCount} attendances</Btn>
            ) : (
              <div className="rounded-lg p-3.5 mt-3" style={{ background: C.panel2, border: `1px solid #FF9D6B44` }}>
                <div className="flex justify-between"><span style={{ color: C.muted }}>{invoice.lines}</span><b>{gbp(invoice.total)}</b></div>
                <div className="flex items-center gap-2 mt-3">
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: invoice.status === "Paid" ? C.mint : C.amber }}>
                    {["Draft", "Issued", "Paid"].map((s, i) => (
                      <span key={s} style={{ opacity: ["Draft","Issued","Paid"].indexOf(invoice.status) >= i ? 1 : 0.3 }}>
                        {s}{i < 2 ? " → " : ""}
                      </span>
                    ))}
                  </span>
                  <span className="flex-1" />
                  {invoice.status === "Draft" && <Btn small tone="amber" onClick={issueInvoice}>Issue</Btn>}
                  {invoice.status === "Issued" && <Btn small tone="mint" onClick={payInvoice}>Mark paid</Btn>}
                  {invoice.status === "Paid" && <Btn small tone="mint" onClick={() => setStepId("return")}>Continue →</Btn>}
                </div>
              </div>
            )}
            <div className="mt-4">{["Admin App", "API"].map((s) => <SysBadge key={s} name={s} />)}</div>
          </Frame>
        );

      case "return":
        return (
          <Frame chrome="member">
            <Kicker>Step 11 · Return & grow</Kicker>
            <h2 style={h2}>{member?.name.split(" ")[0]} comes back — the cycle repeats</h2>
            <div className="grid grid-cols-2 gap-2.5 mt-3">
              {[
                ["Events attended", db.attendances.filter((a) => a.memberId === memberId).length],
                ["Lifetime spend", gbp(spend)],
                ["Loyalty", loyalty?.rewardUnlocked ? "Reward ready ★" : `${loyalty?.stamps}/10 stamps`],
                ["Churn risk", "Low · attended this week"],
              ].map(([k, v]) => (
                <div key={k} className="rounded-lg p-3" style={{ background: C.panel2, border: `1px solid ${C.line}` }}>
                  <div style={{ fontSize: 11, color: C.dim }}>{k}</div>
                  <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 21 }}>{v}</div>
                </div>
              ))}
            </div>
            <p style={{ ...pMuted, marginTop: 10, fontSize: 12.5 }}>
              Iterable segments now target them with territory-scoped codes; if they lapse, win-back fires at 30/60/90 days.
            </p>
            <div className="flex gap-2 mt-3">
              <Btn onClick={restartLoop}>Loop back to step 02 →</Btn>
              <Btn ghost tone="violet" onClick={resetAll}>Reset demo</Btn>
            </div>
            <div className="mt-4">{["Member App", "Iterable", "API"].map((s) => <SysBadge key={s} name={s} />)}</div>
          </Frame>
        );

      default:
        return null;
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: C.ink, color: C.text, fontFamily: "'Barlow', sans-serif" }}>
      <style>{`
                * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #35305A; border-radius: 4px; }
        button:focus-visible, input:focus-visible { outline: 2px solid ${C.violet}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header className="px-4 pt-4 pb-2 max-w-6xl mx-auto">
        <div className="flex items-baseline justify-between flex-wrap gap-2">
          <div>
            <div style={{ fontFamily: "'Barlow Condensed', sans-serif", letterSpacing: "0.22em", fontSize: 12, color: C.violet, textTransform: "uppercase" }}>
              Ceroc franchise platform · playable demo
            </div>
            <h1 style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: "clamp(26px, 4vw, 38px)", letterSpacing: "0.01em", margin: 0, lineHeight: 1.05 }}>
              Dancer Journey <span style={{ color: C.magenta }}>— from discovery to return visit</span>
            </h1>
          </div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: C.dim }}>
            website · member app · sso · venue app · iterable · admin app
          </div>
        </div>
        <div className="mt-3">
          <JourneyRail stepId={stepId} path={path} />
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 pb-6 grid gap-4 lg:grid-cols-2" style={{ height: "calc(100vh - 150px)", minHeight: 520 }}>
        <div style={{ minHeight: 0 }}>{screen()}</div>
        <div style={{ minHeight: 0 }} className="hidden lg:block">
          <DataPanel db={db} trace={trace} lastWrite={lastWrite} />
        </div>
        <div className="lg:hidden" style={{ minHeight: 380 }}>
          <DataPanel db={db} trace={trace} lastWrite={lastWrite} />
        </div>
      </main>
    </div>
  );
}

const h2 = {
  fontFamily: "'Barlow Condensed', sans-serif",
  fontSize: 23,
  letterSpacing: "0.01em",
  margin: "2px 0 4px",
  lineHeight: 1.15,
};
const pMuted = { color: "#9C93BA", fontSize: 13.5, lineHeight: 1.55, margin: 0 };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
